{% extends 'base.html' %}

{% block title %}{% if object %}Editar{% else %}Crear{% endif %} producto - Tienda Libre{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-4">{% if object %}Editar{% else %}Crear{% endif %} producto</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'tiendalibre:catalogo' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
