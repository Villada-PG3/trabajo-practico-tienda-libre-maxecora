{% extends 'base.html' %}

{% block title %}Eliminar {{ object.nombre }} - Tienda Libre{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-4">Eliminar producto</h1>
            <p>¿Estás seguro de que querés eliminar <strong>{{ object.nombre }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
                <a href="{% url 'tiendalibre:detalle_producto' object.pk %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
