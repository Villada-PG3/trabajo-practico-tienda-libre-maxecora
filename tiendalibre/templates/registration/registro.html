{% extends 'base.html' %}

{% block title %}Registro - Tienda Libre{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <h1 class="mb-4">Crear cuenta</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Registrarse</button>
                <a href="{% url 'login' %}" class="btn btn-secondary">Ya tengo una cuenta</a>
            </form>
        </div>
    </div>
{% endblock %}
