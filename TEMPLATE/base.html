<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Libre{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --tienda-blue: #0b3d91;
            --tienda-cyan: #00bfff;
        }

        .navbar-tienda {
            background: linear-gradient(90deg, var(--tienda-blue), #1261c9);
        }

        .navbar-tienda .navbar-brand {
            color: #fff;
            font-weight: 700;
        }

        .navbar-tienda .nav-link {
            color: #000 !important;
        }

        .navbar-tienda .nav-link:hover,
        .navbar-tienda .nav-link:focus {
            color: #000 !important;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: #f4f7fb;
        }

        main {
            flex: 1;
        }

        .footer-tienda {
            margin-top: 3rem;
            padding: 1.5rem 1rem;
            background: #0b3d91;
            color: #fff;
            text-align: center;
            border-top: 4px solid #00bfff;
        }

        .footer-tienda p {
            margin: 0;
            font-size: 0.95rem;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>
    {% include "_navbar.html" %}

    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
